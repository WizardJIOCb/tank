map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream tank_arena_app {
  server 127.0.0.1:3017;
  keepalive 32;
}

server {
  listen 80;
  server_name tank.rodion.pro;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name tank.rodion.pro;

  # Managed by certbot or your TLS automation.
  ssl_certificate /etc/letsencrypt/live/tank.rodion.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tank.rodion.pro/privkey.pem;

  root /var/www/tank.rodion.pro/dist;
  index index.html;

  location ^~ /api/ {
    proxy_pass http://tank_arena_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /socket.io/ {
    proxy_pass http://tank_arena_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
